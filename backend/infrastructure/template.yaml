AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Finkargo fkhub - Backend API (Lambda Container + HTTP API Gateway)

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - staging
      - prod
    Description: Environment name

  AuthorizerMemorySize:
    Type: Number
    Default: 2048
    MinValue: 128
    MaxValue: 10240
    Description: Memory size for the authorizer Lambda function (MB)

  AuthorizerTimeout:
    Type: Number
    Default: 120
    MinValue: 3
    MaxValue: 900
    Description: Timeout for the authorizer Lambda function (seconds)

  ImageUri:
    Type: String
    Description: ECR image URI for the Lambda function
    Default: ""

Conditions:
  UseImageUri: !Not [!Equals [!Ref ImageUri, ""]]

Globals:
  Function:
    Architectures:
      - x86_64
    Timeout: !Ref AuthorizerTimeout

Resources:
  FinkargoFKhubAPI:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub api-fkhub-${Environment}
      Description: FastAPI backend for Finkargo fkhub System (Docker Container)
      PackageType: Image
      ImageUri: !If
        - UseImageUri
        - !Ref ImageUri
        - !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/fkhub-api:latest"
      MemorySize: !Ref AuthorizerMemorySize
      Timeout: !Ref AuthorizerTimeout
      Environment:
        Variables:
          APP_NAME: Finkargo fkhub System
      Tags:
        Environment: !Ref Environment
        Application: api-fkhub
    Metadata:
      DockerTag: !Ref Environment
      DockerContext: ../
      Dockerfile: Dockerfile

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref FinkargoFKhubAPI
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:2spr393u04/*/*"

  AuthorizerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/api-fkhub-${Environment}
      RetentionInDays: 7

Outputs:
  FinkargoFKhubAPIFunction:
    Description: Lambda Function ARN
    Value: !GetAtt FinkargoFKhubAPI.Arn
    Export:
      Name: FinkargoFKhubAPIFunctionArn

  FinkargoFKhubAPIFunctionIamRole:
    Description: IAM Role for Lambda function
    Value: !GetAtt FinkargoFKhubAPIRole.Arn
    Export:
      Name: FinkargoFKhubAPIFunctionRoleArn

  LogGroupName:
    Description: CloudWatch Log Group for the Lambda
    Value: !Ref AuthorizerLogGroup
    Export:
      Name: !Sub ${AWS::StackName}-LogGroupName
