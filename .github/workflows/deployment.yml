# This workflow builds a Docker image, pushes it to ECR, and deploys to Lambda
name: Deploy AWS Lambda (Docker)
run-name: Deploy AWS Lambda with Docker Container

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Define minimal permissions required for the workflow
permissions:
  id-token: write # Required for requesting the JWT
  contents: read # Required for checking out the repository

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    name: Detect Changes

    permissions:
      contents: read

    outputs:
      changed-components: ${{ steps.filter.outputs.changes }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Ensure previous commit is available for comparison

      - name: Detect Changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'

      - name: Print Changed Components
        run: "echo 'Changed Components: ${{ steps.filter.outputs.changes }}'"

  build-and-push:
    needs: detect-changes
    if: ${{ success() && needs.detect-changes.outputs.changed-components != '[]' }}
    name: Build Docker Image and Push to ECR
    runs-on: ubuntu-latest
    environment: production

    outputs:
      image-uri: ${{ steps.build-image.outputs.image }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        env:
          AWS_REGION: ${{ secrets.AWS_REGION_CLOUD_GOVERMENT }}
          AWS_ROLE: ${{ secrets.ROLE_AWS_SANDBOX_CG }}
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          role-session-name: GitHub-AWS-Role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: fkhub-api
          IMAGE_TAG: ${{ github.sha }}
          ENVIRONMENT: ${{ vars.ENVIRONMENT || 'prod' }}
        run: |
          # Create ECR repository if it doesn't exist
          aws ecr describe-repositories --repository-names ${ECR_REPOSITORY} || \
            aws ecr create-repository --repository-name ${ECR_REPOSITORY}

          # Build Docker image
          cd backend
          docker build -t ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG} .
          docker tag ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG} ${ECR_REGISTRY}/${ECR_REPOSITORY}:${ENVIRONMENT}
          docker tag ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG} ${ECR_REGISTRY}/${ECR_REPOSITORY}:latest

          # Push all tags
          docker push ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
          docker push ${ECR_REGISTRY}/${ECR_REPOSITORY}:${ENVIRONMENT}
          docker push ${ECR_REGISTRY}/${ECR_REPOSITORY}:latest

          # Output image URI for deployment
          echo "image=${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Print Image URI
        run: echo "Built and pushed image ${{ steps.build-image.outputs.image }}"

  deploy:
    name: Deploy to AWS Lambda
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-push]
    if: ${{ success() && needs.detect-changes.outputs.changed-components != '[]' }}
    environment: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        env:
          AWS_REGION: ${{ secrets.AWS_REGION_CLOUD_GOVERMENT }}
          AWS_ROLE: ${{ secrets.ROLE_AWS_SANDBOX_CG }}
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          role-session-name: GitHub-AWS-Role
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate AWS Authentication
        run: aws sts get-caller-identity

      - name: Deploy to AWS with SAM
        env:
          AWS_REGION: ${{ secrets.AWS_REGION_CLOUD_GOVERMENT }}
          STACK_NAME: ${{ vars.STACK_NAME || 'api-fkhub' }}
          ENVIRONMENT: ${{ vars.ENVIRONMENT || 'prod' }}
          IMAGE_URI: ${{ needs.build-and-push.outputs.image-uri }}
        run: |
          cd backend/infrastructure

          # Debug: Print IMAGE_URI
          echo "IMAGE_URI: ${IMAGE_URI}"

          # Validate IMAGE_URI is not empty
          if [ -z "${IMAGE_URI}" ]; then
            echo "ERROR: IMAGE_URI is empty. Build job may have failed or been skipped."
            echo "Check the 'Build Docker Image and Push to ECR' job output."
            exit 1
          fi

          # Extract repository (remove tag)
          IMAGE_REPO="${IMAGE_URI%:*}"
          echo "IMAGE_REPO: ${IMAGE_REPO}"

          # Deploy with SAM
          sam deploy \
            --stack-name ${STACK_NAME} \
            --capabilities CAPABILITY_IAM \
            --region ${AWS_REGION} \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --image-repository ${IMAGE_REPO} \
            --parameter-overrides "ParameterKey=Environment,ParameterValue=${ENVIRONMENT}" "ParameterKey=ImageUri,ParameterValue=${IMAGE_URI}"

      - name: Get Lambda Function Info
        env:
          AWS_REGION: ${{ secrets.AWS_REGION_CLOUD_GOVERMENT }}
          ENVIRONMENT: ${{ vars.ENVIRONMENT || 'prod' }}
        run: |
          aws lambda get-function \
            --function-name api-fkhub-${ENVIRONMENT} \
            --region ${AWS_REGION} \
            --query 'Configuration.[FunctionName,Runtime,MemorySize,Timeout,PackageType]' \
            --output table
