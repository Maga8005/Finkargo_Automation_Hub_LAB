# This workflow is triggered on push events to the ARQ/devops branch.
# It detects changes in specific directories and deploys AWS Lambda functions accordingly.

name: Deploy AWS Lambdas
run-name: Deploy AWS Lambdas Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Define minimal permissions required for the workflow.
permissions:
  id-token: write # Required for requesting the JWT
  contents: read # Required for checking out the repository

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    name: Detect Changes

    permissions:
      contents: read

    outputs:
      changed-components: ${{ steps.filter.outputs.changes }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Ensure previous commit is available for comparison

      - name: Detect Changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'

      - name: Print Changed Components
        run: "echo 'Changed Components: ${{ steps.filter.outputs.changes }}'"

  validate-and-build:
    needs: detect-changes
    if: ${{ success() && needs.detect-changes.outputs.changed-components != '[]' }}
    name: Validate and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Cache SAM Build
        uses: actions/cache@v4
        with:
          path: backend/infrastructure/.aws-sam
          key: sam-build-${{ hashFiles('backend/**', 'backend/infrastructure/template.yaml') }}
          restore-keys: |
            sam-build-

      - name: Validate SAM Template
        run: |
          cd backend/infrastructure
          sam validate --lint

      - name: Build Lambda Functions
        run: |
          cd backend/infrastructure
          sam build --cached

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sam-build
          path: backend/infrastructure/.aws-sam/build/
          retention-days: 1

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: [detect-changes, validate-and-build]
    if: ${{ success() && needs.detect-changes.outputs.changed-components != '[]' }}
    environment: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: sam-build
          path: backend/infrastructure/.aws-sam/build/

      - name: Verify SAM CLI
        run: sam --version

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        env:
          AWS_REGION: ${{ secrets.AWS_REGION_CLOUD_GOVERMENT }}
          AWS_ROLE: ${{ secrets.ROLE_AWS_SANDBOX_CG }}
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          role-session-name: GitHub-AWS-Role
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate AWS Authentication
        run: aws sts get-caller-identity

      - name: Deploy to AWS
        env:
          AWS_REGION: ${{ secrets.AWS_REGION_CLOUD_GOVERMENT }}
          STACK_NAME: ${{ vars.STACK_NAME || 'api-fkhub' }}
          ENVIRONMENT: ${{ vars.ENVIRONMENT || 'prod' }}
        run: |
          cd backend/infrastructure
          sam deploy \
            --stack-name ${STACK_NAME} \
            --capabilities CAPABILITY_IAM \
            --region ${AWS_REGION} \
            --resolve-s3 \
            --no-confirm-changeset \
            htt \
            --parameter-overrides Environment=${ENVIRONMENT}